# sources.yml — documentation sources to index
# Uncomment and edit the examples below.

sources: []

  # Confluence pages (need CONFLUENCE_* vars in .env):
  # - type: confluence_page
  #   page_id: "12345"
  #   space_key: MYSPACE
  #   title: "My Team's Documentation"
  #
  # - type: confluence_page
  #   page_id: "67890"
  #   space_key: MYSPACE
  #   title: "Architecture Guidelines"

  # Local git repos (no auth needed):
  # - type: git_repo
  #   repo_path: "/path/to/my-repo"
  #   include_patterns: ["README.md", "CLAUDE.md", "docs/**/*.md"]
  #   title: "My Repo"

  # Ingest a whole Confluence subtree: the root page + all current descendants
  # edited within `stale_months` months (omit `stale_months` or set it to null
  # to disable the staleness filter). root_page_id MUST be quoted (it is a string).
  # - type: confluence_tree
  #   root_page_id: "123456789"
  #   space_key: "TEAM"
  #   title: "Team space: docs subtree"
  #   tags: [example-team]
  #   stale_months: 24
