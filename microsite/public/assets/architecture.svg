<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="docforge architecture: data flow from Confluence and local git repos through ingest, Postgres plus pgvector, and MCP server to AI coding assistants">
  <style>
    .bg { fill: #fafaf7; }
    .box { fill: #ffffff; stroke: #1a1a1a; stroke-width: 2; }
    .box-strong { fill: #ffffff; stroke: #1a1a1a; stroke-width: 3; }
    .label { font-family: ui-monospace, 'JetBrains Mono', Consolas, 'Cascadia Mono', monospace; font-size: 18px; fill: #1a1a1a; }
    .label-small { font-family: ui-monospace, 'JetBrains Mono', Consolas, 'Cascadia Mono', monospace; font-size: 13px; fill: #737373; }
    .arrow { stroke: #d97706; stroke-width: 3; fill: none; }
    .arrow-label { font-family: ui-monospace, 'JetBrains Mono', Consolas, 'Cascadia Mono', monospace; font-size: 13px; fill: #d97706; }
  </style>

  <rect class="bg" width="1200" height="520"/>

  <!-- Sources (left) -->
  <rect class="box" x="40" y="120" width="200" height="70" rx="6"/>
  <text class="label" x="140" y="155" text-anchor="middle">Confluence space</text>
  <text class="label-small" x="140" y="175" text-anchor="middle">REST v2 + API token</text>

  <rect class="box" x="40" y="320" width="200" height="70" rx="6"/>
  <text class="label" x="140" y="355" text-anchor="middle">Local git repos</text>
  <text class="label-small" x="140" y="375" text-anchor="middle">README, CLAUDE.md, docs/</text>

  <!-- Pipeline (middle) -->
  <rect class="box-strong" x="300" y="220" width="180" height="80" rx="6"/>
  <text class="label" x="390" y="258" text-anchor="middle">docforge ingest</text>
  <text class="label-small" x="390" y="278" text-anchor="middle">crawl · chunk · embed</text>

  <rect class="box-strong" x="540" y="220" width="200" height="80" rx="6"/>
  <text class="label" x="640" y="258" text-anchor="middle">Postgres + pgvector</text>
  <text class="label-small" x="640" y="278" text-anchor="middle">HNSW index, 768-dim</text>

  <rect class="box-strong" x="800" y="220" width="180" height="80" rx="6"/>
  <text class="label" x="890" y="258" text-anchor="middle">docforge serve</text>
  <text class="label-small" x="890" y="278" text-anchor="middle">FastMCP</text>

  <!-- Assistants (right) -->
  <rect class="box" x="1040" y="140" width="140" height="50" rx="6"/>
  <text class="label" x="1110" y="170" text-anchor="middle">Claude Code</text>

  <rect class="box" x="1040" y="240" width="140" height="50" rx="6"/>
  <text class="label" x="1110" y="270" text-anchor="middle">Cursor</text>

  <rect class="box" x="1040" y="340" width="140" height="50" rx="6"/>
  <text class="label" x="1110" y="370" text-anchor="middle">Copilot</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Sources → ingest -->
  <path class="arrow" d="M 240 155 Q 270 155 280 200 L 300 230" marker-end="url(#arrow-head)"/>
  <path class="arrow" d="M 240 355 Q 270 355 280 310 L 300 290" marker-end="url(#arrow-head)"/>

  <!-- Pipeline flow -->
  <path class="arrow" d="M 480 260 L 540 260" marker-end="url(#arrow-head)"/>
  <path class="arrow" d="M 740 260 L 800 260" marker-end="url(#arrow-head)"/>

  <!-- Serve → assistants (MCP) -->
  <path class="arrow" d="M 980 250 Q 1010 210 1040 170" marker-end="url(#arrow-head)"/>
  <path class="arrow" d="M 980 265 L 1040 265" marker-end="url(#arrow-head)"/>
  <path class="arrow" d="M 980 280 Q 1010 320 1040 360" marker-end="url(#arrow-head)"/>

  <text class="arrow-label" x="1010" y="200">MCP</text>

  <!-- Section labels -->
  <text class="label-small" x="140" y="70" text-anchor="middle" fill="#1a1a1a">Sources</text>
  <text class="label-small" x="640" y="70" text-anchor="middle" fill="#1a1a1a">Pipeline</text>
  <text class="label-small" x="1110" y="90" text-anchor="middle" fill="#1a1a1a">AI coding assistants</text>
</svg>
