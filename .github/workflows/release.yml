name: release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install build
        run: python -m pip install --upgrade build
      - name: Build distribution
        run: python -m build
      - name: Verify wheel RECORD invariants
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/*.whl | head -1)
          RECORD=$(unzip -p "$WHEEL" "*-info/RECORD")
          DOCFORGE=$(echo "$RECORD" | grep -c '^docforge/' || true)
          SRC=$(echo "$RECORD" | grep -c '^src/docforge' || true)
          if [ "$DOCFORGE" -lt 1 ]; then
            echo "ERROR: wheel RECORD has no docforge/ entries" >&2
            exit 1
          fi
          if [ "$SRC" -ne 0 ]; then
            echo "ERROR: wheel RECORD has src/docforge/ entries (src/ leaked into install path)" >&2
            exit 1
          fi
          echo "OK: $DOCFORGE docforge/ entries, $SRC src/docforge entries"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
