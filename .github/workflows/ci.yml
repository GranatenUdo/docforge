name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

env:
  # Opt in to Node 24 for action entrypoints. Required by June 2, 2026; this
  # silences the deprecation warning early. Safe to remove after that date.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - run: ruff check src/docforge tests
      - run: ruff format --check src/docforge tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e ".[dev,entra]"
      - run: pytest -m "not integration"

  build-embedder-image:
    # Master-push-only so PR CI isn't gated on ACR/HF secrets being wired up
    # in the repo. Operator must set up HF_TOKEN, ACR_LOGIN_SERVER,
    # ACR_USERNAME, ACR_PASSWORD repo secrets before merging anything that
    # depends on the embedder image — see README "Self-hosting / forking".
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login -u "${{ secrets.ACR_USERNAME }}" --password-stdin "${{ secrets.ACR_LOGIN_SERVER }}"
      - name: Build and push embedder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.embedder
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/docforge-embedder:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/docforge-embedder:latest
          secrets: |
            "hf_token=${{ secrets.HF_TOKEN }}"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-minilm-l6-v2
      - run: pip install -e ".[dev,entra]"
      # --no-cov: the 60% fail_under threshold in pyproject.toml is calibrated
      # for the unit suite (which exercises ~74%). Integration tests cover a
      # different slice of the codebase and naturally sit at ~40%; gating
      # integration on the unit-calibrated threshold would always fail.
      - run: pytest -m integration --no-cov
