name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  # Manual reruns of lint/test/integration. Does not trigger build-embedder-image
  # (that job's `if:` gates on push to master, deliberately).
  workflow_dispatch:

permissions:
  contents: read

env:
  # Opt in to Node 24 for action entrypoints. Required by June 2, 2026; this
  # silences the deprecation warning early. Safe to remove after that date.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - run: ruff check src/docforge tests
      - run: ruff format --check src/docforge tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e ".[dev,entra]"
      - run: pytest -m "not integration"

  build-embedder-image:
    # Master-push-only so PR CI isn't gated on ACR/HF secrets being wired up
    # in the repo. Operator must set up HF_TOKEN, ACR_LOGIN_SERVER,
    # ACR_USERNAME, ACR_PASSWORD repo secrets to enable image build/push —
    # see README "Self-hosting / forking".
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check secret configuration
        id: check
        env:
          HF_TOKEN_SET: ${{ secrets.HF_TOKEN != '' }}
          ACR_PASSWORD_SET: ${{ secrets.ACR_PASSWORD != '' }}
        run: |
          if [ "$HF_TOKEN_SET" = "false" ]; then
            echo "HF_TOKEN secret not set; skipping embedder image build (the model is gated and requires a HuggingFace token at build time)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "HF_TOKEN configured; embedder image will be built."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            if [ "$ACR_PASSWORD_SET" = "true" ]; then
              echo "ACR secrets configured; image will be pushed to registry."
              echo "push=true" >> "$GITHUB_OUTPUT"
            else
              echo "ACR secrets not set; image will be built but not pushed (Dockerfile sanity check only)."
              echo "push=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/checkout@v6
        if: steps.check.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skip != 'true'
      - name: Login to ACR
        if: steps.check.outputs.push == 'true'
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login -u "${{ secrets.ACR_USERNAME }}" --password-stdin "${{ secrets.ACR_LOGIN_SERVER }}"
      - name: Build embedder image
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.embedder
          push: ${{ steps.check.outputs.push == 'true' }}
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER && format('{0}/docforge-embedder:{1}', secrets.ACR_LOGIN_SERVER, github.sha) || format('docforge-embedder:{0}', github.sha) }}
            ${{ secrets.ACR_LOGIN_SERVER && format('{0}/docforge-embedder:latest', secrets.ACR_LOGIN_SERVER) || '' }}
          secrets: |
            "hf_token=${{ secrets.HF_TOKEN }}"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-minilm-l6-v2
      - run: pip install -e ".[dev,entra]"
      # --no-cov: the 60% fail_under threshold in pyproject.toml is calibrated
      # for the unit suite (which exercises ~74%). Integration tests cover a
      # different slice of the codebase and naturally sit at ~40%; gating
      # integration on the unit-calibrated threshold would always fail.
      - run: pytest -m integration --no-cov
