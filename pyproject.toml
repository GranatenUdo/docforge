[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docforge-cli"
version = "0.1.0"
description = "Forge searchable context from Confluence and git repos for AI coding assistants"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "beautifulsoup4>=4.12",
    "sentence-transformers>=5.0",
    "pgvector>=0.3",
    "pyyaml>=6.0",
    "fastmcp>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "numpy>=1.26",
]

[project.scripts]
docforge = "docforge.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.0",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.0",
]
entra = [
    "fastapi-azure-auth>=5.0",
    "azure-identity>=1.19",
]

[tool.setuptools.packages.find]
include = ["docforge*"]

[tool.setuptools.package-data]
docforge = ["templates/**/*", "sql/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires Docker (pgvector container)",
]
addopts = "--cov=docforge"

[tool.coverage.report]
fail_under = 60
exclude_also = [
    "if __name__ == \"__main__\":",
    "pragma: no cover",
    "raise NotImplementedError",
]
